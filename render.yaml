services:
  - type: web
    name: signal-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt psycopg2-binary redis"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: signal-db
          property: connectionString

databases:
  - name: signal-db
    databaseName: signal_db
    user: signal_admin
    plan: free
